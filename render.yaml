# Render Blueprint: https://render.com/docs/infrastructure-as-code
#
# If DATABASE_URL is missing on the web service, the app cannot start — check
# Dashboard → Web Service → Environment after deploy. When not using this file,
# paste the Postgres "Internal Database URL" as DATABASE_URL manually.
#
# Docker + Playwright: use at least a Starter web instance.

services:
  - type: web
    name: steam-discussion-scraper
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOW_MEMORY
        value: "1"
      - key: DB_POOL_MAX
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: steam-scraper-db
          property: connectionString

databases:
  - name: steam-scraper-db
    databaseName: steam_scraper
    user: steam_scraper
    plan: free
